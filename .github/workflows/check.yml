name: Prüfen

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen, Formatierung, Tests
        run: npm run check
      - name: Raycast-Lint
        run: npx ray lint
      - name: Raycast-Build
        run: npx ray build -e dist
